name: daily-check
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site files
        run: |
          python3 - <<'PY'
          import json, re, os, glob, sys
          bad = []
          for f in ['mcq.json', 'search-index.json', 'term2/mcq.json', 'term2/search-index.json']:
              if os.path.exists(f):
                  try: json.load(open(f))
                  except Exception as e: bad.append('invalid json: ' + f)
          if os.path.exists('mcq.json'):
              for i, q in enumerate(json.load(open('mcq.json'))):
                  if not (0 <= q['a'] < len(q['o'])): bad.append('bad answer index at %d' % i)
                  if len(set(q['o'])) < len(q['o']): bad.append('duplicate options at %d' % i)
          for f in glob.glob('*.html') + glob.glob('term2/*.html'):
              d = os.path.dirname(f)
              t = open(f, encoding='utf-8').read()
              for h in re.findall(r'href="([^"#?:]+\.html)"', t):
                  if not os.path.exists(os.path.join(d, h)): bad.append('dead link %s -> %s' % (f, h))
              if re.search(r'wa\.me|whatsapp', t, re.I): bad.append('whatsapp link in ' + f)
          print('\n'.join(bad) if bad else 'all checks passed')
          sys.exit(1 if bad else 0)
          PY
