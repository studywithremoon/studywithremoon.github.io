name: unpack
on: [push]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o 2-rel2.zip
          rm 2-rel2.zip .github/workflows/unpack.yml
          git config user.name "unpack"
          git config user.email "unpack@local"
          git add -A
          git commit -m "unpack"
          git push
