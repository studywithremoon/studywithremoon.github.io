name: unpack
on: push
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unzip release
        run: |
          Z=$(ls *-site-rel3.zip | head -1)
          unzip -o "$Z" -d .
          rm -f "$Z"
      - name: remove this workflow
        run: rm -f .github/workflows/unpack.yml
      - name: commit
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -m "unpack" || echo "nothing to commit"
          git push
