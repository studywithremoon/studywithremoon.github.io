name: unpack
on: [push]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o 2-pub.zip
          rm -f 2-pub.zip .github/workflows/unpack.yml
      - run: |
          git config user.name "unpack"
          git config user.email "unpack@local"
          git add -A
          git commit -m "unpack site update" || echo "nothing to commit"
          git push
