<script>(function(){
var $=function(i){return document.getElementById(i)};
function norm(s){return (s||'').replace(/[\u064B-\u0652]/g,'').replace(/[\u0623\u0625\u0622\u0671]/g,'\u0627').replace(/\u0649/g,'\u064A').replace(/\u0629/g,'\u0647').toLowerCase()}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hl(s,t){var e=esc(s);if(!t)return e;var te=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
try{return e.replace(new RegExp('('+te+')','gi'),'<mark>$1</mark>')}catch(_){return e}}
function cut(s,n){s=(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n)+'...':s}
var data=null;
Promise.all([fetch('mcq.json').then(function(r){return r.json()}),fetch('defs.json').then(function(r){return r.json()}),fetch('search-index.json').then(function(r){return r.json()})]).then(function(all){data={mcq:all[0],defs:all[1],idx:all[2]};if(location.hash.length>1){$('q').value=decodeURIComponent(location.hash.slice(1));go()}}).catch(function(){$('out').innerHTML='<div class="none">تعذر تحميل البيانات</div>'});
function item(href,q,a,s,t){return '<a class="qa" href="'+href+'"><div class="q">'+hl(q,t)+'</div>'+(a?'<div class="a">'+hl(cut(a,160),t)+'</div>':'')+'<div class="s">'+esc(s||'')+'</div></a>'}
function go(){var raw=$('q').value.trim();var out=$('out');
if(!data){out.innerHTML='';return}
if(norm(raw).length<2){out.innerHTML='';return}
var t=norm(raw);var h='';
var ds=data.defs.filter(function(d){return norm(d.q).indexOf(t)>-1||norm(d.a).indexOf(t)>-1});
if(ds.length){h+='<div class="grp">تعريفات ('+ds.length+')</div>';ds.slice(0,30).forEach(function(d){h+=item(d.p+'?q='+d.i,d.q,d.a,d.s,raw)});if(ds.length>30)h+='<div class="foot">و '+(ds.length-30)+' نتيجة أخرى</div>'}
var ms=data.mcq.filter(function(d){if(norm(d.q).indexOf(t)>-1)return true;var o=d.o||[];for(var i=0;i<o.length;i++){if(norm(o[i]).indexOf(t)>-1)return true}return false});
if(ms.length){h+='<div class="grp">أسئلة ('+ms.length+')</div>';ms.slice(0,30).forEach(function(d){h+=item(d.p+'?q='+d.i,d.q,'',d.s,raw)});if(ms.length>30)h+='<div class="foot">و '+(ms.length-30)+' نتيجة أخرى</div>'}
var xs=(data.idx.e||[]).filter(function(d){return norm(d.t).indexOf(t)>-1||norm(d.b).indexOf(t)>-1});
if(xs.length){h+='<div class="grp">دروس وصفحات ('+xs.length+')</div>';xs.slice(0,20).forEach(function(d){var cc=data.idx.c&&data.idx.c[d.c];h+=item((cc?cc.f:'dash.html')+(d.k?'#p'+d.k+'-'+d.i:''),d.t,d.b,cc?cc.n:'',raw)});if(xs.length>20)h+='<div class="foot">و '+(xs.length-20)+' نتيجة أخرى</div>'}
out.innerHTML=h||'<div class="none">مفيش نتائج مطابقة — جرب كلمة تانية</div>'}
$('q').addEventListener('input',go);
})()</script><script src="feat.js?v=10" defer></script><div id="crights" data-pagefind-ignore style="text-align:center;opacity:.55;font-size:12px;margin:24px 0 8px">كل الحقوق محفوظة © Remoon. ممنوع إعادة النشر من غير إذن</div>
