<script>(function(){var T=[["النفقات العامة", 0], ["الضريبة", 0], ["قواعد الضريبة", 0], ["الموازنة العامة", 0], ["الإتاوة", 0], ["خصائص الضريبة", 0], ["مبدأ العدالة", 0], ["مبدأ اليقين", 0], ["مبدأ الملاءمة", 0], ["أهداف الضريبة", 0], ["الرسم", 0], ["الإتاوة وشروطها", 0], ["النفقات الجارية", 0], ["وعاء الضريبة", 0], ["سعر الضريبة", 0], ["القرض العام", 0], ["عجز الموازنة", 0], ["شركات الأشخاص", 1], ["شركات الأموال", 1], ["حسابات الشركاء", 1], ["الاحتياطيات", 1], ["التصفية", 1], ["الشهرة الظاهرة", 1], ["الشهرة المستترة", 1], ["شركة التضامن", 1], ["السهم", 1], ["رأس المال", 1], ["المسحوبات", 1], ["صافي الربح", 1], ["خصائص الأزمة", 2], ["مراحل الأزمة", 2], ["فريق الأزمة", 2], ["الإنذار المبكر", 2], ["إدارة الأزمة", 2], ["الاحتواء", 2], ["خطة الطوارئ", 2], ["المتحدث الرسمي", 2], ["استعادة النشاط", 2], ["التاجر", 3], ["المحل التجاري", 3], ["الإفلاس", 3], ["الاحتراف", 3], ["الاسم التجاري", 3], ["العملاء والسمعة", 3], ["الكمبيالة", 3], ["أطراف الكمبيالة", 3], ["السند الإذني", 3], ["الشيك", 3], ["النظام الإنتاجي", 4], ["التنبؤ بالطلب", 4], ["إدارة المخزون", 4], ["الجودة", 4], ["المدخلات", 4], ["المخرجات", 4], ["التغذية العكسية", 4], ["المتوسط المتحرك", 4], ["تكلفة التخزين", 4], ["أنواع التقارير", 5], ["عناصر التقرير", 5], ["خطوات الكتابة", 5], ["الأسلوب", 5], ["التوثيق", 5], ["الأسلوب الجيد", 5], ["التقرير الدوري", 5], ["الملخص التنفيذي", 5], ["التوصيات", 5], ["الموضوعية", 5], ["المراجع", 5]],SUB=["مقدمة في المالية العامة", "محاسبة الشركات", "إدارة الأزمات", "قانون تجاري", "إدارة الإنتاج والعمليات", "كتابة التقارير"],cur,sl,ch,idx=[];
function sc(){try{return JSON.parse(localStorage.getItem('sd-words'))||{ok:0,n:0}}catch(e){return{ok:0,n:0}}}
function put(k){var s=sc();s.n++;if(k)s.ok++;localStorage.setItem('sd-words',JSON.stringify(s));show()}
function show(){var s=sc();document.getElementById('w-ok').textContent=s.ok;document.getElementById('w-n').textContent=s.n}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function nxt(){var i,g=0;do{i=Math.floor(Math.random()*T.length);g++}while(idx.indexOf(i)>-1&&g<50);idx.push(i);if(idx.length>12)idx.shift();return T[i]}
function render(){var S=document.getElementById('w-s'),C=document.getElementById('w-c');S.innerHTML='';C.innerHTML='';sl=[];ch=[];document.getElementById('w-m').textContent='';
var words=cur[0].split(' '),all=[];
words.forEach(function(w){var g=document.createElement('div');g.className='wg';Array.from(w).forEach(function(c){var b=document.createElement('button');b.type='button';b.className='sl';b.dataset.v=c;b.onclick=function(){back(b)};g.appendChild(b);sl.push(b);all.push(c)});S.appendChild(g)});
var m=shuf(all),t=0;while(m.join('')===all.join('')&&t++<9&&all.length>1)m=shuf(all);
m.forEach(function(c){var b=document.createElement('button');b.type='button';b.className='ch';b.textContent=c;b.onclick=function(){add(b)};C.appendChild(b);ch.push(b)});
document.getElementById('w-h').textContent=SUB[cur[1]]+' · '+words.map(function(w){return Array.from(w).length}).join(' + ')+' حروف'}
function add(b){var s=sl.filter(function(x){return !x.textContent})[0];if(!s)return;s.textContent=b.textContent;s._c=b;s.classList.add('f');b.classList.add('u');chk()}
function back(s){if(!s.textContent||s.classList.contains('ok'))return;s._c.classList.remove('u');s.textContent='';s.classList.remove('f','no')}
function chk(){if(sl.some(function(x){return !x.textContent}))return;var ok=sl.every(function(x){return x.textContent===x.dataset.v}),m=document.getElementById('w-m');
if(ok){sl.forEach(function(x){x.classList.add('ok')});m.textContent='برافو!';put(1);if(window.SD_TOAST)SD_TOAST('pos');setTimeout(function(){cur=nxt();render()},1400)}
else{sl.forEach(function(x){if(x.textContent!==x.dataset.v)x.classList.add('no')});m.textContent='قريب! جرّب تاني.';put(0);if(window.SD_TOAST)SD_TOAST('neg');setTimeout(function(){sl.forEach(function(x){if(x.classList.contains('no')){x._c.classList.remove('u');x.textContent='';x.classList.remove('f','no')}})},700)}}
document.getElementById('w-hint').onclick=function(){var s=sl.filter(function(x){return x.textContent!==x.dataset.v})[0];if(!s)return;if(s.textContent)back(s);var c=ch.filter(function(b){return !b.classList.contains('u')&&b.textContent===s.dataset.v})[0];if(c)add(c)};
document.getElementById('w-skip').onclick=function(){cur=nxt();render()};
show();cur=nxt();render()})()</script>
<script>document.addEventListener("click",function(e){var b=e.target.closest(".op");if(b){var q=b.parentNode;if(q.dataset.done)return;q.dataset.done=1;var a=+q.dataset.ans;q.querySelectorAll(".op").forEach(function(x){var i=+x.dataset.i;if(i===a)x.classList.add("ok");else if(x===b)x.classList.add("no")});q.querySelector(".a").hidden=false;return}var m=e.target.closest(".md");if(m){document.querySelectorAll(".md").forEach(function(x){x.classList.remove("on")});m.classList.add("on");document.querySelectorAll(".sx").forEach(function(x){x.hidden=x.id!==m.dataset.t});return}var s=e.target.closest(".sh");if(s){s.nextElementSibling.hidden=false;s.hidden=true}});</script><p class="foot">للمراجعة والتدريب</p></main></div><script src="feat.js?v=7" defer></script><script data-goatcounter="https://studywithremoon.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
