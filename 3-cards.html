 var lab=el('label','','المادة والفصل');lab.setAttribute('for','sj');var sel=el('select');sel.id='sj';var o=el('option','','كل البطاقات');o.value='all';sel.appendChild(o);subj().forEach(function(x){var p=el('option','',x[1]);p.value=x[0];sel.appendChild(p)});
 var lab2=el('label','','نوع المراجعة');lab2.setAttribute('for','md');var md=el('select');md.id='md';[['due','المستحقة للمراجعة والجديدة'],['new','الجديدة بس'],['all','كل البطاقات بالترتيب العشوائي']].forEach(function(x){var p=el('option','',x[1]);p.value=x[0];md.appendChild(p)});
 var st=el('div','st');function pool(){return DATA.filter(function(c){return sel.value==='all'||c.p===sel.value})}
 function upd(){var c=counts(pool());st.innerHTML='';[['جديدة',c.n],['للمراجعة',c.d],['متقنة',c.m]].forEach(function(x){var d=el('div');d.appendChild(el('b','',x[1]));d.appendChild(el('span','',x[0]));st.appendChild(d)})}
 sel.onchange=upd;set.appendChild(lab);set.appendChild(sel);set.appendChild(lab2);set.appendChild(md);set.appendChild(st);upd();

  q.sort(function(){return Math.random()-.5});if(md.value==='due')q.sort(function(a,b){return (s[id(a)]?0:1)-(s[id(b)]?0:1)});run(q.slice(0,30))};
 set.appendChild(go);
 var rs=el('button','bt','مسح تقدمي في البطاقات');rs.type='button';rs.style.cssText='width:100%;margin-top:8px;opacity:.7';rs.onclick=function(){if(confirm('تمسح تقدمك في البطاقات؟')){L.removeItem('sd-fc');home()}};set.appendChild(rs)}
function run(q){set.innerHTML='';box.innerHTML='';var i=0,flip=false,done=0,tot=q.length;
 function show(){box.innerHTML='';if(i>=q.length){fin();return}var c=q[i],w=el('div','cd');w.appendChild(el('div','hd',''+(Math.min(done+1,tot))+' من '+tot));w.firstChild.appendChild(el('span','',c.s));
  var f=el('button','cf'+(flip?' back':''));f.type='button';if(flip){f.textContent=c.a}else{f.appendChild(el('strong','',c.q))}f.onclick=function(){flip=!flip;show()};w.appendChild(f);
  w.appendChild(el('div','tip',flip?'اضغط على البطاقة للرجوع':'فكّر في الإجابة، وبعدها اضغط لعرضها'));
  if(flip){var r=el('div','row');var k=el('button','bt ok','عرفتها');var u=el('button','bt mid','محتاج أراجعها');k.type=u.type='button';
   k.onclick=function(){rate(c,true);done++;i++;flip=false;show()};u.onclick=function(){rate(c,false);q.push(c);i++;flip=false;show()};r.appendChild(u);r.appendChild(k);w.appendChild(r)}
  box.appendChild(w)}
 function rate(c,ok){var s=state(),x=s[id(c)]||{b:0,d:0};if(ok){x.b=Math.min(5,x.b+1);x.d=Date.now()+IV[x.b]*DAY;if(window.SD_TOAST&&Math.random()<.35)SD_TOAST('pos')}else{x.b=0;x.d=Date.now();if(window.SD_TOAST&&Math.random()<.5)SD_TOAST('neg')}s[id(c)]=x;sv('sd-fc',s)}
